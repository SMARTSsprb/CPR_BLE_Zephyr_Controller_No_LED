# Zephyr RTOS Project Configuration
# Target: ESP32-C3 Super Mini / esp32c3_devkitm
# Project: CPR BLE Monitor (No LED)

# Serial Console & Logging
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Kernel & Stacks
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=8192

# Bluetooth Subsystem (BLE 5.0 Peripheral)
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="CPR_106"
CONFIG_BT_DEVICE_APPEARANCE=0
CONFIG_BT_MAX_CONN=2
CONFIG_BT_MAX_PAIRED=2
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_GATT_DYNAMIC_DB=y

# Bluetooth Battery Service (0x180F) for Mobile Percentage Display
CONFIG_BT_BAS=y

# MTU & Buffers for High Throughput & Zero-Delay
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251

# Peripheral Hardware Drivers
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_ADC=y
CONFIG_I2C=y

# Floating Point Formatting Support (for BMP280 Airway Pressure)
CONFIG_CBPRINTF_FP_SUPPORT=y

